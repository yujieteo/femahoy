[package]
name = "fh-viewer"
description = "eframe app, wgpu mesh and contour renderer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fh-core = { version = "0.0.0", path = "../core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Headers", "Request", "Response", "HtmlCanvasElement", "Window", "Document", "Element", "HtmlElement", "HtmlSelectElement", "Node", "Event", "EventTarget", "KeyboardEvent"] }

[lib]
crate-type = ["cdylib", "rlib"]
