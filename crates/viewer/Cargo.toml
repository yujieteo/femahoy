[package]
name = "fh-viewer"
description = "eframe app, wgpu mesh and contour renderer, teammate tree"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
fh-inp = { version = "0.0.0", path = "../inp" }
fh-io = { version = "0.0.0", path = "../io" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Headers", "Request", "Response", "HtmlCanvasElement", "Window"] }

[lib]
crate-type = ["cdylib", "rlib"]
