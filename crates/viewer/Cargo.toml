[package]
name = "fh-viewer"
description = "eframe app, wgpu mesh and contour renderer, terminal widget, chat panel, teammate tree"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
fh-inp = { version = "0.0.0", path = "../inp" }
