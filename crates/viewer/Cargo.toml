[package]
name = "fh-viewer"
description = "eframe app, wgpu mesh and contour renderer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
fh-core = { version = "0.0.0", path = "../core" }
fh-fem = { version = "0.0.0", path = "../fem" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "Headers", "Request", "RequestInit", "Response", "Url", "Worker", "HtmlCanvasElement", "Window", "Document", "Element", "HtmlElement", "HtmlSelectElement", "Node", "Event", "EventTarget", "KeyboardEvent", "CssStyleDeclaration", "DomRect", "MediaQueryList"] }

[lib]
crate-type = ["cdylib", "rlib"]
