<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>femahoy</title>
<style>
/* The layout of the page of fh serve. The tokens and the components (the toolbar, the buttons,
   the menu and the help row) come from the UI layer of femahoy (crates/viewer/src/ui.rs). */
/*UI*/
body { display: flex; overflow: hidden; }

#chat {
  display: flex; flex: none; flex-direction: column; width: clamp(320px, 30vw, 440px);
  background: var(--side); border-right: 1px solid var(--line);
}
#chat .toolbar { font: var(--title)/1.2 var(--serif); }
#log {
  display: flex; flex: 1; flex-direction: column; gap: var(--space-3); overflow-y: auto;
  padding: var(--space-1) var(--space-4) var(--space-4); scrollbar-width: thin; scrollbar-color: var(--raised) transparent;
}
#empty { margin: auto 0; padding: 0 var(--space-2); text-align: center; color: var(--muted); }
#empty strong { display: block; margin-bottom: var(--space-2); font: 1.75rem/1.15 var(--serif); color: var(--text); text-wrap: balance; }
.you { align-self: flex-end; max-width: 88%; padding: var(--space-2) 14px; border-radius: 18px; background: var(--raised); }
.you, .say, pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
details { font-size: var(--small); color: var(--muted); }
summary {
  display: flex; align-items: center; gap: 6px; min-height: var(--target); margin: 0 -6px; padding: 0 6px;
  border-radius: var(--radius); list-style: none; cursor: pointer;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "\203A"; flex: none; width: 8px; transition: transform 0.15s; }
details[open] > summary::before { transform: rotate(90deg); }
summary:hover { background: var(--raised); color: var(--text); }
summary code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.meta { flex: none; }
.failed > summary, .failed .meta, pre.fail { color: var(--error); }
.failure { padding: var(--space-2) var(--space-3); border: 1px solid var(--error); border-radius: var(--radius); font-size: var(--small); }
.failure strong { display: block; font-weight: 500; color: var(--error); }
.failure pre { margin-top: var(--space-1); max-height: 200px; overflow: auto; }
details pre { margin-top: 6px; padding: 10px var(--space-3); max-height: 360px; overflow: auto; border-radius: var(--radius); background: var(--code); color: var(--text); }
.note { margin: 0; font-size: var(--small); color: var(--muted); overflow-wrap: anywhere; }
.open { align-self: flex-start; overflow-wrap: anywhere; }
.end { margin: 0; padding-top: var(--space-2); border-top: 1px solid var(--line); font-size: var(--small); color: var(--muted); }
.end::first-letter { text-transform: uppercase; }
#work { display: grid; gap: 2px; margin: 0 var(--space-3) var(--space-2); padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: var(--radius); font-size: var(--small); color: var(--muted); }
#work p { display: flex; align-items: center; gap: var(--space-2); min-width: 0; margin: 0; }
#work b { flex: none; width: 40px; font-weight: 500; }
#work code, #work span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
#busy::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--text); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.2; } }
#clock { margin-left: auto; font-variant-numeric: tabular-nums; }
#error { margin: 0 var(--space-4) var(--space-2); font-size: var(--small); color: var(--error); overflow-wrap: anywhere; }
#composer { margin: 0 var(--space-3) var(--space-3); padding: 10px 6px 6px var(--space-4); border: 1px solid var(--line); border-radius: 24px; background: var(--raised); }
#input {
  display: block; width: 100%; max-height: 200px; padding: 2px 0 6px; border: 0; outline: 0;
  resize: none; background: none; font: inherit; color: inherit; line-height: 1.5;
}
#input::placeholder { color: var(--muted); }
.row { display: flex; align-items: center; gap: var(--space-2); }
.row .keys { flex: 1; }

#model { display: flex; flex: 1; flex-direction: column; min-width: 0; }
#runs { min-width: 0; font-weight: 500; }
#view { position: relative; flex: 1; min-height: 0; }
#fh { position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: 0; }
#msg { position: absolute; top: 40%; left: 0; right: 0; margin: 0; padding: 0 var(--space-4); text-align: center; color: var(--muted); }
</style>
</head>
<body>
<aside id="chat">
  <header class="toolbar">femahoy</header>
  <div id="log">
    <p id="empty"><strong>Ask the agent for a model</strong>For example: build and solve a steel cantilever of 100 x 10 x 10 mm with 1 MPa on the top face.</p>
  </div>
  <div id="work" hidden>
    <p id="busy">The agent works<span id="clock"></span></p>
    <p id="now" hidden><b>Now</b><code></code></p>
  </div>
  <p id="error" hidden></p>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="A message for the agent" aria-label="A message for the agent"></textarea>
    <div class="row">
      <p class="keys" id="hint"><span><kbd>Ctrl</kbd> <kbd>Enter</kbd> sends</span></p>
      <p class="keys" id="later" hidden>The agent reads your message at its next step</p>
      <button type="button" class="icon primary" id="stop" title="Stop the agent and the commands that it started" aria-label="Stop" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
      </button>
      <button type="submit" class="icon primary" id="send" aria-label="Send" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </form>
</aside>
<main id="model">
  <header class="toolbar">
    <select id="runs" aria-label="The run in the model view"><option value="">Open a run</option></select>
  </header>
  <div id="view"><canvas id="fh" aria-label="The 3D model view"></canvas><p id="msg">Loading the viewer...</p></div>
</main>
<script type="module" nonce="NONCE">
// The page of fh serve: the chat with the agent, the list of the runs and
// the wasm viewer. The token comes from the page address and goes only
// in the Authorization header of each request to this daemon.
const query = new URLSearchParams(location.search);
const token = query.get("token") || "";
const $ = (id) => document.getElementById(id);
const [log, work, input, send, stop, runs, msg] =
  ["log", "work", "input", "send", "stop", "runs", "msg"].map($);
// The keys that send, with the names of the keyboard: Command and Return on a Mac, else
// Control and Enter. Each of the 2 modifier keys sends.
const keys = /^(Mac|iP)/.test(navigator.platform) ? ["\u2318", "Return"] : ["Ctrl", "Enter"];
document.querySelectorAll("#hint kbd").forEach((k, i) => (k.textContent = keys[i]));
send.title = "Send (" + keys.join("+") + ")";

// A request to the daemon: a POST when it has a body. An HTTP error gives the field
// `message` of the answer.
async function call(path, body) {
  const method = body === undefined ? "GET" : "POST";
  const r = await fetch(path, { method, body, headers: { Authorization: "Bearer " + token } });
  if (!r.ok) {
    const text = await r.text();
    const field = (k) => (text.split("\n").find((l) => l.startsWith(k + "=")) || "").slice(k.length + 1);
    throw new Error(path + ": HTTP " + r.status + ": " + field("message"));
  }
  return r;
}

// The fields and the items of an answer: `key=value` lines, a blank line, then 1 item on
// each line. An answer with no fields starts with the blank line.
async function reply(path, body) {
  const lines = (await (await call(path, body)).text()).split("\n");
  const fields = {};
  let i = 0;
  for (; i < lines.length && lines[i] !== ""; i++) {
    const k = lines[i].indexOf("=");
    if (k > 0) fields[lines[i].slice(0, k)] = lines[i].slice(k + 1);
  }
  return { fields, items: lines.slice(i + 1).filter((l) => l) };
}

// The text before and after the first space.
function split(text) {
  const i = text.indexOf(" ");
  return i < 0 ? [text, ""] : [text.slice(0, i), text.slice(i + 1)];
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  e.className = cls;
  e.textContent = text;
  return e;
}

// The model view.
let view = null;
let shown = query.get("run");

// Show the results of a run, and keep the run in the page address for a reload.
function openRun(run) {
  shown = run;
  select();
  history.replaceState(null, "", "?" + new URLSearchParams({ token, run }));
  if (view) view.open(run);
}

function select() {
  runs.value = shown || "";
  if (runs.selectedIndex < 0) runs.value = "";
}

// The name of each run: the folder of its input file.
const names = {};
let listing = null;

// The runs that have results, newest first, in the list at the top of the model view.
async function listRuns() {
  const found = [];
  for (const item of (await reply("/api/v1/runs")).items.reverse()) {
    const [run, input] = split(item);
    names[run] = input.split("/").slice(-2, -1)[0] || input;
    found.push([run, input]);
  }
  const first = new Option(found.length ? "Open a run" : "No run has results", "");
  first.disabled = true;
  runs.replaceChildren(first);
  for (const [run, input] of found) {
    const o = new Option(runLabel(run), run);
    o.title = input;
    runs.add(o);
  }
  select();
}
runs.addEventListener("change", () => runs.value && openRun(runs.value));

// Read the list again, 1 time at once. Then each run on the page shows its name.
function relist() {
  listing ||= listRuns()
    .catch((e) => showError(e.message))
    .finally(() => {
      listing = null;
      for (const e of document.querySelectorAll("[data-run]")) e.textContent = runLabel(e.dataset.run);
    });
}

// A run as `<name> · <run>`.
const runLabel = (run) => (names[run] ? names[run] + " · " : "") + run;

function runName(run) {
  const e = el("span", "", runLabel(run));
  e.dataset.run = run;
  if (!(run in names)) relist();
  return e;
}

async function startViewer() {
  try {
    const js = await (await call("/viewer/fh_viewer.js")).text();
    const viewer = await import(URL.createObjectURL(new Blob([js], { type: "text/javascript" })));
    const wasm = await (await call("/viewer/fh_viewer_bg.wasm")).arrayBuffer();
    await viewer.default({ module_or_path: wasm });
    view = await viewer.start($("fh"), token);
    msg.remove();
    // The canvas takes the focus when it starts. The person writes first.
    input.focus();
    if (shown) view.open(shown);
  } catch (e) {
    msg.textContent = "The viewer cannot start. " + ((e && e.message) || e);
  }
}

// The chat. An entry is the item `<seq> <kind> <text>`. In the text, `\n` is a line break
// and `\\` is a backslash.
let since = 0;
// The entries up to this number were there when the page opened. Their runs do not open again.
let first = null;
let running = false;
let reading = false;
let again = false;
let timer = 0;
// The commands and the tools with no result yet, the oldest first.
let waiting = [];
// The time when the agent started to work.
let started = 0;

const unescape = (t) => t.replace(/\\(.?)/g, (_, c) => (c === "n" ? "\n" : c || "\\"));

function showError(text) {
  $("error").textContent = text;
  $("error").hidden = !text;
}

// The status of the work above the composer: the time and the last action of the agent. The
// text box is always on: the agent reads a message at its next step.
function setRunning(on, fields = {}) {
  running = on;
  work.hidden = !on;
  stop.hidden = !on;
  send.disabled = !input.value.trim();
  $("hint").hidden = on;
  $("later").hidden = !on;
  started = Number(fields.started_ms) || 0;
  tick();
}

function status(id, text, title) {
  const p = $(id);
  p.hidden = !text;
  p.lastChild.textContent = text;
  p.lastChild.title = title || text;
}

function tick() {
  const s = started ? Math.max(0, Math.floor((Date.now() - started) / 1000)) : 0;
  const clock = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  $("clock").textContent = started ? clock : "";
}
setInterval(() => running && tick(), 1000);

// A failure as a clear entry with its error. The title is a text or a list of parts.
function failure(title, text) {
  const d = el("div", "failure", "");
  const t = el("strong", "", "");
  t.append(...[].concat(title));
  d.append(t, el("pre", "", text));
  return d;
}

function rest() {
  waiting = [];
  status("now", "");
}

// A command or a tool as 1 line. The person can expand it to see the full text and the result.
function action(verb, subject, full) {
  const d = document.createElement("details");
  const s = document.createElement("summary");
  s.append(el("span", "", verb), el("code", "", subject), el("span", "meta", ""));
  d.append(s);
  if (full) d.append(el("pre", "", subject));
  return d;
}

function result(d, kind, text) {
  const lines = text ? text.split("\n").length : 0;
  d.querySelector(".meta").textContent =
    kind === "fail" ? "failed" : lines ? lines + (lines === 1 ? " line" : " lines") : "no output";
  d.classList.toggle("failed", kind === "fail");
  d.open ||= kind === "fail";
  if (text) d.append(el("pre", kind, text));
}

function entry(kind, text, fresh) {
  switch (kind) {
    case "you":
      return el("div", "you", text);
    case "say":
      return el("p", "say", text);
    case "cmd": {
      const d = action("$", text, text.length > 48 || text.includes("\n"));
      waiting.push(d);
      status("now", "$ " + text.split("\n")[0]);
      return d;
    }
    case "tool": {
      const d = action(...split(text), false);
      waiting.push(d);
      status("now", text);
      return d;
    }
    case "out":
    case "fail": {
      const d = waiting.shift();
      if (d) return result(d, kind, text);
      if (kind === "fail") return failure("Error", text);
      const alone = action("Result", text.split("\n")[0], false);
      result(alone, kind, text);
      return alone;
    }
    case "error":
      rest();
      return failure("The agent failed", text);
    case "setup":
      return failure("Set up Claude Code", text);
    case "open": {
      const b = el("button", "open", "Show the results of ");
      b.append(runName(text));
      b.type = "button";
      b.addEventListener("click", () => openRun(text));
      if (fresh) {
        openRun(text);
        listRuns().catch((e) => showError(e.message));
      }
      return b;
    }
    case "show": {
      const [preview, title] = split(text);
      const b = el("button", "open", "Show the supports and loads of " + title);
      b.type = "button";
      const open = () => {
        shown = null;
        select();
        if (view) view.show(preview, title);
      };
      b.addEventListener("click", open);
      if (fresh) open();
      return b;
    }
    case "end":
      rest();
      return el("p", "end", text);
    default: {
      if (text === "stopped the agent") rest();
      if (!text.includes("\n")) return el("p", "note", text);
      const d = action("Note", text.split("\n")[0], false);
      d.append(el("pre", "", text));
      return d;
    }
  }
}

function add(item) {
  const [seq, rest] = split(item);
  if (!(Number(seq) > since)) return;
  since = Number(seq);
  const [kind, text] = split(rest);
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  $("empty")?.remove();
  const node = entry(kind, unescape(text), since > first);
  if (node) log.append(node);
  if (stick) log.scrollTop = log.scrollHeight;
}

// Read the new entries: each second while the agent works, else each 5 seconds.
async function read() {
  if (reading) return void (again = true);
  reading = true;
  clearTimeout(timer);
  try {
    const r = await reply("/api/v1/chat?since=" + since);
    if (first === null) first = Number(r.fields.next) || 0;
    r.items.forEach(add);
    setRunning(r.fields.state === "running", r.fields);
    showError("");
  } catch (e) {
    showError(e.message);
  }
  reading = false;
  if (again) {
    again = false;
    return read();
  }
  timer = setTimeout(read, running ? 1000 : 5000);
}

// Send the message to the agent, also while it works.
async function ask() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  grow();
  send.disabled = true;
  try {
    await call("/api/v1/chat", text);
    showError("");
  } catch (e) {
    showError(e.message);
    input.value = text;
    grow();
  }
  read();
}

function grow() {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  ask();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    ask();
  }
});
input.addEventListener("input", () => {
  grow();
  send.disabled = !input.value.trim();
});
stop.addEventListener("click", () =>
  call("/api/v1/chat/stop", "").then(() => read(), (e) => showError(e.message)));

read();
listRuns().catch((e) => showError(e.message));
startViewer();
</script>
</body>
</html>
