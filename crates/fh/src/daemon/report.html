<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-NONCE' blob: 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'">
<title>femahoy report</title>
<style>
/* The layout of a report. The tokens (also the series --s1 to --s8 of the plots) and the
   components (the toolbar, the buttons, the menu, the segmented control and the legend) come
   from the UI layer of femahoy (crates/viewer/src/ui.rs). */
/*UI*/
body { display: flex; overflow: hidden; font-size: var(--read); }
#report { display: flex; flex-direction: column; min-width: 0; width: clamp(360px, 42vw, 720px); }
#report > header { border-bottom: 1px solid var(--line); }
article { flex: 1; min-height: 0; overflow-y: auto; padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 5rem; background: var(--side); border-right: 1px solid var(--line); }
article h1 { margin: 0.5rem 0 1rem; font-size: clamp(2rem, 4vw, 2.75rem); letter-spacing: -0.015em; text-wrap: balance; }
article h2 { margin: 3rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--line); font-size: 1.75rem; }
/* A rule above the first heading of the text separates nothing. */
article > h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
article h3 { margin: 2rem 0 0.75rem; font-size: 1.25rem; }
article p, article li { text-wrap: pretty; }
article table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
article th, article td { padding: 0.375rem 0.75rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
article th { border-bottom-color: var(--text); font-weight: 500; }
article pre { padding: 0.75rem 1rem; overflow-x: auto; border-radius: 4px; background: var(--code); }
article :not(pre) > code { padding: 1px 4px; border-radius: 3px; background: var(--code); overflow-wrap: anywhere; }
article button, article select, .toolbar button, .toolbar select { font-size: var(--body); }
/* A report with no run has no viewer: the text fills the page. */
body:not(:has(#model)) #report, body.text-mode #report { width: 100%; flex: 1; }
body:not(:has(#model)) article, body.text-mode article { padding-inline: max(var(--space-4), calc(50% - 32rem)); }
body.text-mode #model { display: none; }
#identity { overflow-wrap: anywhere; font-size: var(--small); }
[data-mesh-trend] > section > h3 { margin-top: var(--space-4); }
summary { min-height: var(--target); cursor: pointer; padding-block: var(--space-2); }
@media (max-width: 800px) {
  body { flex-direction: column; }
  #report { width: 100%; flex: 1; min-height: 0; }
  #model { flex: none !important; height: 55%; }
}
.curve { margin: 2rem 0; }
.curve figcaption { font-family: var(--serif); font-size: 1.25rem; }
.curve svg { display: block; width: 100%; height: auto; font-size: 12px; }
.curve text { fill: var(--muted); }
.curve .label { fill: var(--text); }
.curve .grid { stroke: var(--line); }
.curve .frame { fill: none; stroke: var(--muted); }
.curve polyline { fill: none; stroke-width: 2; stroke-linejoin: round; }
.curve .sample-cursor { stroke: var(--text); stroke-width: 1; stroke-dasharray: 4 3; }
.curve circle { stroke: var(--side); stroke-width: 2; }
.curve .legend { font-size: 0.875rem; }
.curve p { margin: 4px 0; font-size: 0.875rem; color: var(--muted); }
/* A run in the text is a link: an inline text link needs no larger hit target. */
[data-run]:not(button, select, option, input) { cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
@media (hover: hover) { [data-run]:not(button, select, option, input):hover { text-decoration-color: var(--accent); } }
output { margin-left: var(--space-2); }
#model { display: flex; flex: 1; flex-direction: column; min-width: 0; }
#bar { display: contents; }
/* With no bar controls and no list of the runs, the header of the model is empty: the model takes its height. */
#model > header:has(> #bar:empty):has(> #runs[hidden]) { display: none; }
#all { color: var(--muted); font-size: var(--small); }
#view { position: relative; flex: 1; min-height: 0; }
#fh { position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: 0; }
#msg { position: absolute; top: 40%; left: 0; right: 0; margin: 0; padding: 0 1rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<section id="report" aria-label="Report">
<header id="report-tools" class="toolbar" aria-label="Report controls" hidden>
<label id="section-control" hidden>Section <select id="sections" aria-label="Report section" aria-keyshortcuts="Alt+S"></select></label>
<span id="layout-control" class="segmented" role="group" aria-label="Report layout" hidden>
<label><input type="radio" name="layout" value="text" aria-keyshortcuts="Alt+T">Text</label>
<label><input type="radio" name="layout" value="split" checked aria-keyshortcuts="Alt+V">Split</label>
</span>
<span id="identity" class="readout" aria-live="polite" hidden></span>
<label id="all" class="trail"><input type="checkbox"> Show all controls</label>
<p id="report-keys" class="keys"></p>
</header>
<article><!--TEXT--></article>
</section>
<main id="model">
  <header class="toolbar"><div id="bar"></div><select id="runs" aria-label="The run in the model view" hidden><!--OPTIONS--></select></header>
  <div id="view"><canvas id="fh" aria-label="The 3D model view"></canvas><p id="msg">Loading the viewer...</p></div>
</main>
<!--VIEWER-->
<!--CFD-DATA-->
<script type="module" nonce="NONCE">
// The report starts the wasm viewer of fh serve (page.html) with no daemon. The viewer
// fetches its files from a daemon, so the files of this report answer its fetches: each
// `script[data-path]` below holds 1 file in base64, under the path that the daemon serves.
// A report of `fh report --viewer FILE` has no viewer files. The script FILE beside it sets
// `fhViewer` to each viewer file, under its daemon path. Each file is raw deflate in base64.
//
// The agent writes the controls of the report in its text. An element with `data-run="RUN"`
// opens that run with the view of its other `data-` attributes, 1 line `KEY=VALUE` for each
// (`View::parse` of the viewer): `data-fields`, `data-controls`, `data-step`, `data-scale`,
// `data-box` and `data-marks`. A click opens the run of a link or a button. A change opens the
// run of the chosen option of a `select`, or of a checked radio button. A slider
// (`input type="range"`) shows the step of its value: its first move opens its run, the next
// moves change only the step. Its `data-labels` gives the text of each value from `min`, with
// "|" between them. An element with `data-bar` goes to the bar above the model view. The list
// of the runs and the controls of the viewer that the view does not show stay behind the
// switch "Show all controls". At the start, the report opens the first chosen element of the
// bar, else of the text, else the first run of the list.
/*CFD*/
const $ = (id) => document.getElementById(id);
const runs = $("runs");
const text = document.querySelector("article");
// No marker means every report control. A marker shows only the controls that it names.
const controls = new Set((text.querySelector("[data-report-controls]")?.dataset.reportControls ?? "sections,layout,identity").split(","));
const hasRuns = runs.options.length > 0;
const hints = [];
if (controls.has("sections")) {
  const headings = [...text.querySelectorAll("h2")];
  if (headings.length) {
    $("section-control").hidden = false;
    headings.forEach((h, i) => $("sections").add(new Option(h.textContent, i)));
    $("sections").addEventListener("change", () => {
      const heading = headings[$("sections").value];
      text.scrollTop += heading.getBoundingClientRect().top - text.getBoundingClientRect().top;
      heading.tabIndex = -1;
      heading.focus({ preventScroll: true });
    });
    // The menu shows the section at the top of the text, so a choice of any other section jumps.
    // At the end of the text, a chosen section in view stays: a short last section cannot reach the top.
    const current = () => {
      const box = text.getBoundingClientRect();
      const chosen = headings[$("sections").selectedIndex]?.getBoundingClientRect().top;
      if (text.scrollTop + text.clientHeight >= text.scrollHeight - 1 && chosen >= box.top && chosen < box.bottom) return;
      // Above the first heading (the top padding of the text, or an introduction), the menu shows the first section.
      $("sections").selectedIndex = Math.max(0, headings.findLastIndex((h) => h.getBoundingClientRect().top <= box.top + 1));
    };
    text.addEventListener("scroll", current, { passive: true });
    current();
    hints.push("<kbd>Alt S</kbd> Section");
  }
}
if (controls.has("layout") && hasRuns) {
  $("layout-control").hidden = false;
  $("layout-control").addEventListener("change", (e) => {
    // The text reflows to the new width, so keep the first element that starts in view at its offset.
    const top = () => text.getBoundingClientRect().top;
    const anchor = [...text.querySelectorAll("*")].find((e) => e.getClientRects().length && e.getBoundingClientRect().top >= top() - 1);
    const offset = anchor?.getBoundingClientRect().top - top();
    document.body.classList.toggle("text-mode", e.target.value === "text");
    if (anchor) text.scrollTop += anchor.getBoundingClientRect().top - top() - offset;
    window.dispatchEvent(new Event("resize"));
  });
  hints.push("<kbd>Alt T</kbd> Text", "<kbd>Alt V</kbd> Split");
}
$("report-keys").innerHTML = hints.join(" · ");
const identity = () => {
  $("identity").hidden = !controls.has("identity") || !hasRuns;
  $("identity").textContent = "Run: " + (runs.selectedOptions[0]?.textContent ?? "");
};
identity();
// The switch "Show all controls" of a report with runs keeps the header in view.
$("report-tools").hidden = !hints.length && $("identity").hidden && !hasRuns;
document.addEventListener("keydown", (e) => {
  if (!e.altKey || e.ctrlKey || e.metaKey || e.target.tagName === "TEXTAREA" || e.target.isContentEditable
    || (e.target.tagName === "INPUT" && !/^(radio|checkbox|range)$/.test(e.target.type))) return;
  const key = e.code?.startsWith("Key") ? e.code.slice(3).toLowerCase() : e.key.toLowerCase();
  if (key === "s" && !$("section-control").hidden) { e.preventDefault(); $("sections").focus(); }
  if ((key === "t" || key === "v") && !$("layout-control").hidden) {
    e.preventDefault();
    $("layout-control").querySelector(`[value="${key === "t" ? "text" : "split"}"]`).click();
  }
}, { capture: true });
// Each trend contains plots from the curve renderer and tables from the same source rows.
for (const trend of text.querySelectorAll("[data-mesh-trend]")) {
  const panels = [...trend.children].filter((e) => e.tagName === "SECTION");
  const select = document.createElement("select");
  const label = document.createElement("label");
  label.textContent = "Mesh result ";
  select.setAttribute("aria-label", "Mesh metric and analysis condition");
  select.name = "mesh-result";
  panels.forEach((p, i) => select.add(new Option(p.querySelector("h3").textContent, i)));
  const show = () => panels.forEach((p, i) => p.hidden = i !== Number(select.value));
  select.addEventListener("change", show);
  label.append(select);
  trend.prepend(label);
  show();
}
const files = new Map([...document.querySelectorAll("script[data-path]")].map((e) => [e.dataset.path, e]));

const decode = (base64) => {
  const text = atob(base64);
  const bytes = new Uint8Array(text.length);
  for (let i = 0; i < bytes.length; i++) bytes[i] = text.charCodeAt(i);
  return bytes;
};

window.fetch = async (request) => {
  const path = new URL(request.url ?? request, location.href).pathname;
  const base64 = files.get(path)?.textContent ?? window.fhViewer?.[path];
  if (!base64) return new Response("no such file", { status: 404 });
  return new Response(new Blob([decode(base64)]).stream().pipeThrough(new DecompressionStream("deflate-raw")));
};

await cfdFigures(text);
// The values control uses the source rows, never rounded SVG coordinates.
function curveControls(all = false) {
  document.querySelectorAll('.curve [data-control="values"]').forEach((control) => {
    const policy = control.closest('[data-controls]')?.dataset.controls;
    control.hidden = !all && policy !== undefined && !policy.split(',').map(s => s.trim()).includes('values');
    control.querySelector('input').dispatchEvent(new Event('input'));
  });
}
for (const figure of document.querySelectorAll('.curve')) {
  const control = figure.querySelector('[data-control="values"]');
  if (!control) continue;
  const button = control.querySelector('button');
  const body = button.nextElementSibling;
  const slider = control.querySelector('input');
  const rows = [...control.querySelectorAll('tbody tr')];
  const svg = figure.querySelector('svg');
  const cursor = svg.querySelector('.sample-cursor');
  const select = (index) => {
    slider.value = index;
    rows.forEach((row, i) => { row.hidden = i !== Number(slider.value); });
    const row = rows[Number(slider.value)];
    control.querySelector('output').value = row ? `${Number(slider.value) + 1} of ${rows.length}` : 'No samples';
    if (row) {
      cursor.setAttribute('x1', row.dataset.x); cursor.setAttribute('x2', row.dataset.x);
      slider.setAttribute('aria-valuetext', [...row.cells].map((cell, i) => `${control.querySelectorAll('th')[i].textContent}: ${cell.textContent}`).join(', '));
    }
    cursor.toggleAttribute('hidden', control.hidden || body.hidden || !row);
  };
  slider.addEventListener('input', () => select(slider.value));
  button.addEventListener('click', () => { body.hidden = !body.hidden; button.setAttribute('aria-expanded', String(!body.hidden)); select(slider.value); });
  svg.addEventListener('pointerdown', (event) => {
    if (control.hidden || !rows.length) return;
    const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(svg.getScreenCTM().inverse());
    let nearest = 0;
    rows.forEach((row, i) => { if (Math.abs(Number(row.dataset.x) - point.x) < Math.abs(Number(rows[nearest].dataset.x) - point.x)) nearest = i; });
    body.hidden = false;
    button.setAttribute('aria-expanded', 'true');
    select(nearest);
    slider.focus();
  });
}
curveControls();
$('all').addEventListener('change', (event) => curveControls(event.target.checked));

async function start() {
  let open = () => false;
  const cfd = await cfdControls(text, $("bar"), (e) => open(e));
  if (!runs.options.length) {
    const all = $("all");
    if (document.querySelector('.curve [data-control="values"][hidden]')) text.prepend(all);
    $("model").remove();
    return;
  }
  $("all").addEventListener("change", (e) => cfd.all(e.target.checked));
  try {
    const js = await (await fetch("/viewer/fh_viewer.js")).text();
    const viewer = await import(URL.createObjectURL(new Blob([js], { type: "text/javascript" })));
    await viewer.default({ module_or_path: await (await fetch("/viewer/fh_viewer_bg.wasm")).arrayBuffer() });
    const view = await viewer.start($("fh"), "");
    // The switch of the page replaces the switch of the results panel.
    view.all($("all").querySelector("input").checked);
    const bar = $("bar");
    bar.append(...text.querySelectorAll("[data-bar]"));
    const views = () => [...bar.querySelectorAll("[data-run]"), ...text.querySelectorAll("[data-run]")];
    const slider = (e) => e instanceof HTMLInputElement && e.type === "range";
    const chosen = (e) => (e instanceof HTMLOptionElement ? e.selected : e instanceof HTMLInputElement && !slider(e) ? e.checked : true);
    // The text of the value of a slider, from its `data-labels`.
    const label = (e) => {
      const labels = e.dataset.labels?.split("|");
      if (!labels) return;
      if (!(e.nextElementSibling instanceof HTMLOutputElement)) e.after(document.createElement("output"));
      e.nextElementSibling.value = labels[e.value - e.min] ?? e.value;
    };
    views().filter(slider).forEach(label);
    let current = null;
    // Open the run of the element `e`, with its view. False when the report has no such run.
    open = (e) => {
      if (![...runs.options].some((o) => o.value === e.dataset.run)) return false;
      runs.value = e.dataset.run;
      identity();
      const settings = cfd.view(e);
      // The CFD controls keep their own state in `data-angle` and `data-cfd-*`, not in the view.
      const lines = Object.entries(settings).filter(([key]) => !["run", "labels", "bar", "angle"].includes(key) && !key.startsWith("cfd"));
      if (slider(e)) lines.push(["step", e.value]);
      view.open(e.dataset.run, lines.map(([key, value]) => key + "=" + value).join("\n"));
      current = e;
      cfd.select(e);
      return true;
    };
    // The list of the runs opens a run with the view of its first element.
    runs.addEventListener("change", () => open(views().find((e) => e.dataset.run === runs.value) ?? runs.selectedOptions[0]));
    $("all").addEventListener("change", (e) => {
      runs.hidden = !e.target.checked;
      view.all(e.target.checked);
    });
    for (const area of [bar, text]) {
      area.addEventListener("click", (e) => {
        const target = e.target.closest("[data-run]");
        if (target && !(target instanceof HTMLOptionElement || target instanceof HTMLInputElement)) open(target);
      });
      area.addEventListener("change", (e) => {
        const target = e.target instanceof HTMLSelectElement ? e.target.selectedOptions[0] : e.target;
        if (target?.dataset.run && !slider(target) && chosen(target)) open(target);
      });
      area.addEventListener("input", (e) => {
        if (!slider(e.target) || !e.target.dataset.run) return;
        label(e.target);
        if (current === e.target) view.step(Number(e.target.value));
        else open(e.target);
      });
    }
    const first = views().find(chosen);
    if (!first || !open(first)) open(runs.selectedOptions[0]);
    $("msg").remove();
  } catch (e) {
    $("msg").textContent = "The viewer cannot start. " + ((e && e.message) || e);
  }
}
start();
</script>
<!--DATA-->
</body>
</html>
