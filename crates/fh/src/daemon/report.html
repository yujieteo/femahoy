<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-NONCE' blob: 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'">
<title>femahoy report</title>
<style>
/* The style of the site (teoyujie.org): Source Serif 4 for the titles, DM Sans for the text,
   and its colours and spacing. The site has no dark theme: the dark colours are the light
   colours turned over. The page of fh serve (page.html) uses the same colours. --s1 to --s8 are
   the series of the plots, in a fixed order that keeps adjacent series apart for colour-blind
   readers. Each series has a contrast of 3.4 or more to --bg. */
/*FONTS*/
:root {
  --bg: #f4f1ea; --side: #efebe2; --raised: #e6e0d3; --line: #d8d2c4; --code: #ebe6dc;
  --text: #1c1b18; --muted: #5c5950; --accent: #c4613f;
  --serif: "Source Serif 4", Georgia, serif; --sans: "DM Sans", system-ui, sans-serif;
  --s1: #2a6fc4; --s2: #c4613f; --s3: #138a5f; --s4: #a8740a;
  --s5: #c2457a; --s6: #2f7d1f; --s7: #6250d6; --s8: #c43d3c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1b18; --side: #201f1b; --raised: #2e2c27; --line: #3a3730; --code: #252420;
    --text: #ece8df; --muted: #a39e92; --accent: #e0805c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #3a9d3a; --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; overflow: hidden; background: var(--bg); color: var(--text); font: 17px/1.55 var(--sans); }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.15; }
code, pre { font: 0.8125rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
a:hover { text-decoration-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
article { flex: none; width: clamp(360px, 42vw, 720px); overflow-y: auto; padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 5rem; background: var(--side); border-right: 1px solid var(--line); }
article h1 { margin: 0.5rem 0 1rem; font-size: clamp(2rem, 4vw, 2.75rem); letter-spacing: -0.015em; text-wrap: balance; }
article h2 { margin: 3rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--line); font-size: 1.75rem; }
article h3 { margin: 2rem 0 0.75rem; font-size: 1.25rem; }
article p, article li { text-wrap: pretty; }
article table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
article th, article td { padding: 0.375rem 0.75rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
article th { border-bottom-color: var(--text); font-weight: 500; }
article pre { padding: 0.75rem 1rem; overflow-x: auto; border-radius: 4px; background: var(--code); }
article :not(pre) > code { padding: 1px 4px; border-radius: 3px; background: var(--code); overflow-wrap: anywhere; }
/* A report with no run has no viewer: the text fills the page. */
body:not(:has(#model)) article { width: auto; flex: 1; padding-inline: max(1rem, calc(50% - 22rem)); }
.curve { margin: 2rem 0; }
.curve figcaption { font-family: var(--serif); font-size: 1.25rem; }
.curve svg { display: block; width: 100%; height: auto; font-size: 12px; }
.curve text { fill: var(--muted); }
.curve .label { fill: var(--text); }
.curve .grid { stroke: var(--line); }
.curve .frame { fill: none; stroke: var(--muted); }
.curve polyline { fill: none; stroke-width: 2; stroke-linejoin: round; }
.curve circle { stroke: var(--side); stroke-width: 2; }
.curve .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0; padding: 0; list-style: none; font-size: 0.875rem; }
.curve .legend i { display: inline-block; width: 16px; height: 2px; margin-right: 6px; vertical-align: middle; }
.curve .legend i.point { width: 8px; height: 8px; border-radius: 50%; }
.curve p { margin: 4px 0; font-size: 0.875rem; color: var(--muted); }
[data-run] { cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
[data-run]:hover { text-decoration-color: var(--accent); }
#model { display: flex; flex: 1; flex-direction: column; min-width: 0; }
header { flex: none; padding: 0.75rem 1rem; }
#runs { max-width: 100%; padding: 0.375rem 0.75rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: inherit; font: inherit; font-size: 0.9375rem; font-weight: 500; cursor: pointer; }
#runs:hover { border-color: var(--text); }
#view { position: relative; flex: 1; min-height: 0; }
#fh { position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: 0; }
#msg { position: absolute; top: 40%; left: 0; right: 0; margin: 0; padding: 0 1rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<article><!--TEXT--></article>
<main id="model">
  <header><select id="runs" aria-label="The run in the model view"><!--OPTIONS--></select></header>
  <div id="view"><canvas id="fh"></canvas><p id="msg">Loading the viewer...</p></div>
</main>
<!--VIEWER-->
<script type="module" nonce="NONCE">
// The report starts the wasm viewer of fh serve (page.html) with no daemon. The viewer
// fetches its files from a daemon, so the files of this report answer its fetches: each
// `script[data-path]` below holds 1 file in base64, under the path that the daemon serves.
// A report of `fh report --viewer FILE` has no viewer files. The script FILE beside it sets
// `fhViewer` to each viewer file, under its daemon path. Each file is raw deflate in base64.
// The view of a run of `fh report --view` is the file `/views/RUN`.
const $ = (id) => document.getElementById(id);
const runs = $("runs");
const files = new Map([...document.querySelectorAll("script[data-path]")].map((e) => [e.dataset.path, e]));

const decode = (base64) => {
  const text = atob(base64);
  const bytes = new Uint8Array(text.length);
  for (let i = 0; i < bytes.length; i++) bytes[i] = text.charCodeAt(i);
  return bytes;
};

window.fetch = async (request) => {
  const path = new URL(request.url ?? request, location.href).pathname;
  const base64 = files.get(path)?.textContent ?? window.fhViewer?.[path];
  if (!base64) return new Response("no such file", { status: 404 });
  return new Response(new Blob([decode(base64)]).stream().pipeThrough(new DecompressionStream("deflate-raw")));
};

async function start() {
  if (!runs.options.length) {
    $("model").remove();
    return;
  }
  try {
    const js = await (await fetch("/viewer/fh_viewer.js")).text();
    const viewer = await import(URL.createObjectURL(new Blob([js], { type: "text/javascript" })));
    await viewer.default({ module_or_path: await (await fetch("/viewer/fh_viewer_bg.wasm")).arrayBuffer() });
    const view = await viewer.start($("fh"), "");
    $("msg").remove();
    const open = async (run) => {
      runs.value = run;
      const path = "/views/" + run;
      view.open(run, files.has(path) ? await (await fetch(path)).text() : undefined);
    };
    runs.addEventListener("change", () => open(runs.value));
    // An element of the text with `data-run="RUN"` opens that run.
    document.addEventListener("click", (e) => {
      const run = e.target.closest("[data-run]")?.dataset.run;
      if (run && [...runs.options].some((o) => o.value === run)) open(run);
    });
    open(runs.value);
  } catch (e) {
    $("msg").textContent = "The viewer cannot start. " + ((e && e.message) || e);
  }
}
start();
</script>
<!--DATA-->
</body>
</html>
