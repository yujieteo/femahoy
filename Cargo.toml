[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/fem",
    "crates/fh",
    "crates/quine",
    "crates/viewer",
]

[workspace.package]
# The 1 version of femahoy: `fh --version` prints it, and scripts/release.sh checks that the tag
# and the top entry of CHANGELOG.md agree with it.
version = "0.1.0"
edition = "2021"
publish = false

# The tests of `cargo test` solve the grid validation cases. Reason: without optimization, the
# solves of the electromagnetic cases took 13 times longer than with it (the H-plane step case
# took 454 s against 35 s), longer than the time limit of CI. The grid case of a round bar of
# 116,040 unknowns took 359 s, and with this setting 13 s.
[profile.dev.package.fh-fem]
opt-level = 3

# The strict lints of all crates. scripts/check.sh runs clippy with them and fails on a warning.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
float_cmp = "allow"
format_collect = "allow"
format_push_string = "allow"
items_after_statements = "allow"
manual_midpoint = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
naive_bytecount = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_self = "allow"
