name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    # CI installs no solver for now: the solver installs downloaded from a slow Ubuntu mirror and
    # stopped at the time limit. Each test that solves skips. The validation cases run by hand
    # (fh validate, DESIGN.md section 7). This limit is about 3 times the time of the job (2 minutes).
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      # These tests protect the units and differences of the validation reports. They need no solver.
      - name: Test the validation reports
        run: python3 scripts/test-validation-reports.py
      # Only the browser uses the window layer of the viewer, so the wasm build checks it.
      # The built-in solver fh-fem must also build for the browser.
      - name: Test
        run: |
          cargo build -p fh-viewer --lib --target wasm32-unknown-unknown
          cargo build -p fh-fem --target wasm32-unknown-unknown
          cargo test --workspace
