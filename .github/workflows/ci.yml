name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A validation case has no time limit. This limit stops a hung solve. It is about 3 times the
    # time of the job (21 minutes).
    timeout-minutes: 65
    env:
      FH_OPENFOAM: openfoam2512
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit of a pull request and its first parent, the base branch.
          fetch-depth: 2
      # On a pull request, the changed paths select the solvers to install and the cases to run
      # (DESIGN.md section 7). A push to main selects every solver and runs the full suite. Each
      # selected solver gets FH_REQUIRE_<SOLVER>=1 in the Test step.
      - name: Select solvers
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | scripts/ci-select.sh
          else
            scripts/ci-select.sh --all
          fi | tee -a "$GITHUB_OUTPUT"
      # fh starts CalculiX (ccx) as the solver (README.md). Only this job installs
      # ccx. FH_REQUIRE_CCX=1 makes each test that solves through the real ccx fail if ccx is absent.
      # The validation cases are tested with ccx 2.23 (README.md). The Ubuntu package is older,
      # so ccx comes from nixpkgs.
      - uses: cachix/install-nix-action@v31
      - name: Install ccx
        if: steps.select.outputs.ccx == '1'
        run: |
          nix profile install nixpkgs#calculix-ccx
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          ccx -v | head -3
      # fh starts OpenFOAM for the CFD case (README.md). The OpenCFD Debian repository has the
      # same release v2512 as the macOS app. FH_REQUIRE_OPENFOAM=1 makes each test that solves
      # through the real OpenFOAM fail if OpenFOAM is absent.
      - name: Install OpenFOAM
        if: steps.select.outputs.openfoam == '1'
        run: |
          curl -fsSL https://dl.openfoam.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/openfoam.gpg
          echo "deb [signed-by=/usr/share/keyrings/openfoam.gpg] https://dl.openfoam.com/repos/deb $(. /etc/os-release && echo "$VERSION_CODENAME") main" | sudo tee /etc/apt/sources.list.d/openfoam.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openfoam2512
          openfoam2512 -show-api
      # fh mesh, the topology CAD check of a ccx case and the GetDP cases use gmsh.
      - name: Install gmsh
        if: steps.select.outputs.ccx == '1' || steps.select.outputs.getdp == '1'
        run: |
          nix profile install nixpkgs#gmsh
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          "$HOME/.nix-profile/bin/gmsh" -version
      # fh starts GetDP for the electromagnetic and acoustic cases (README.md). GetDP has
      # no package, so its binary comes from getdp.info, checked with its SHA-256. FH_REQUIRE_GETDP=1
      # makes each test that solves through the real GetDP fail if GetDP is absent.
      - name: Install GetDP
        if: steps.select.outputs.getdp == '1'
        run: |
          curl -fsSL -o /tmp/getdp.tgz https://getdp.info/bin/Linux/getdp-3.5.0-Linux64c.tgz
          echo "d3c28fa18f20d6147b4c7367d4dd802e9f7ddb58c608688bbb71919dbca8041d  /tmp/getdp.tgz" | sha256sum -c
          tar xzf /tmp/getdp.tgz -C "$HOME"
          echo "$HOME/getdp-3.5.0-Linux64/bin" >> "$GITHUB_PATH"
          "$HOME/getdp-3.5.0-Linux64/bin/getdp" -version
      # fh starts the Python of PyChrono for the multibody case (README.md). PyChrono is not on
      # PyPI, so micromamba installs it from conda-forge. FH_REQUIRE_PYCHRONO=1 makes each test
      # that solves through the real PyChrono fail if PyChrono is absent.
      - name: Install PyChrono
        if: steps.select.outputs.chrono == '1'
        run: |
          nix profile install nixpkgs#micromamba
          "$HOME/.nix-profile/bin/micromamba" create -y -q -p "$HOME/pychrono" -c conda-forge pychrono=10.0.0 python=3.12
          echo "FH_PYCHRONO=$HOME/pychrono/bin/python" >> "$GITHUB_ENV"
          "$HOME/pychrono/bin/python" -c "import pychrono"
      # fh couples OpenFOAM and CalculiX through preCICE for the FSI case (README.md). The packages
      # of preCICE and of ccx_preCICE come from their GitHub releases, checked with their SHA-256.
      # OpenFOAM loads its adapter as a library, so this step builds it. FH_REQUIRE_PRECICE=1 makes
      # each test that solves through the real preCICE fail if ccx_preCICE is absent.
      - name: Install preCICE
        if: steps.select.outputs.precice == '1'
        working-directory: /tmp
        run: |
          curl -fsSLO https://github.com/precice/precice/releases/download/v3.4.1/libprecice3_3.4.1_noble.deb
          curl -fsSLO https://github.com/precice/calculix-adapter/releases/download/v2.20.2/calculix-precice3_2.20.2-1_amd64_noble.deb
          curl -fsSL -o adapter.tgz https://github.com/precice/openfoam-adapter/releases/download/v1.4.0/openfoam-adapter-1.4.0-OpenFOAMv1812-v2606-newer.tar.gz
          sha256sum -c <<EOF
          3a36a40254acae06409d067381df1b68c309cc4ffb1b1d15590e1fa5359be888  libprecice3_3.4.1_noble.deb
          a95804768d7fec9f3bc52cabd404a36709fbd0955ae330e4c8877041ae1af6b0  calculix-precice3_2.20.2-1_amd64_noble.deb
          399c89ab0fc5dfcff87f77433dddb60d4de0b2071de9b78b0e756e4079fd6a21  adapter.tgz
          EOF
          sudo apt-get install -y --no-install-recommends ./libprecice3_3.4.1_noble.deb ./calculix-precice3_2.20.2-1_amd64_noble.deb openfoam2512-dev
          tar xzf adapter.tgz
          (cd openfoam-adapter-1.4.0 && openfoam2512 ./Allwmake)
          ccx_preCICE -v || true
      # fh starts LAMMPS for the particle case (README.md). The Ubuntu package has the SPH package.
      # FH_REQUIRE_LAMMPS=1 makes each test that solves through the real LAMMPS fail if LAMMPS is
      # absent.
      - name: Install LAMMPS
        if: steps.select.outputs.lammps == '1'
        run: |
          sudo apt-get install -y --no-install-recommends lammps
          lmp -h | head -3
      # Only the browser uses the window layer of the viewer, so the wasm build checks it.
      - name: Test
        run: |
          cargo build -p fh-viewer --lib --target wasm32-unknown-unknown
          cargo test --workspace
        env:
          FH_REQUIRE_CCX: ${{ steps.select.outputs.ccx }}
          FH_REQUIRE_OPENFOAM: ${{ steps.select.outputs.openfoam }}
          FH_REQUIRE_GETDP: ${{ steps.select.outputs.getdp }}
          FH_REQUIRE_PYCHRONO: ${{ steps.select.outputs.chrono }}
          FH_REQUIRE_PRECICE: ${{ steps.select.outputs.precice }}
          FH_REQUIRE_LAMMPS: ${{ steps.select.outputs.lammps }}
      # validate_runs_every_case of the Test step needs every solver. When only some solvers are
      # selected, this step runs the cases of those solvers. A missing selected solver fails a case.
      - name: Validate the selected cases
        if: steps.select.outputs.all != '1' && steps.select.outputs.cases != ''
        env:
          CASES: ${{ steps.select.outputs.cases }}
        run: |
          mkdir -p "$RUNNER_TEMP/selected/validation/cases"
          for id in $CASES; do cp -R "validation/cases/$id" "$RUNNER_TEMP/selected/validation/cases/"; done
          target/debug/fh validate --root "$RUNNER_TEMP/selected"
