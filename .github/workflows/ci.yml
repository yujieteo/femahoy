name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # fh starts CalculiX (ccx) as the solver (README.md). Only this job installs
      # ccx. FH_REQUIRE_CCX=1 makes each test that solves through the real ccx fail if ccx is absent.
      # The validation cases are tested with ccx 2.23 (README.md). The Ubuntu package is older,
      # so ccx comes from nixpkgs.
      - uses: cachix/install-nix-action@v31
      - name: Install ccx
        run: |
          nix profile install nixpkgs#calculix-ccx
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          ccx -v | head -3
      - name: Test
        run: cargo test --workspace
        env:
          FH_REQUIRE_CCX: "1"
