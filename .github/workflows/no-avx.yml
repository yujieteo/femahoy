name: no-avx

# E3: the x86-64 checks with no AVX, under QEMU with the Nehalem CPU model
# (scripts/check-no-avx.sh). The emulator is slow, so the job runs on main, when a person
# starts it. A change to the job is tested with workflow_dispatch on its branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-avx:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QEMU, GNU time and the libraries of gmsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user time libglu1-mesa libgl1 \
            libxcursor1 libxft2 libxinerama1 libxrender1 libxfixes3 libxext6 libfontconfig1 libgomp1
      - name: Install build123d and gmsh
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet build123d==0.13.0 gmsh==4.15.2
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Checks under QEMU Nehalem
        env:
          PYTHON: python
          FH_CHECK_OUT: ${{ runner.temp }}/no-avx
        run: scripts/check-no-avx.sh
      - name: Keep the logs and tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-avx-evidence
          path: ${{ runner.temp }}/no-avx
          if-no-files-found: ignore
