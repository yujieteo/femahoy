# The reference is the published value of MacNeal and Harder 1985 (derivation.md).
# On this mesh (S8R, 1825 nodes) ccx gives a value 0.16 percent from it. A finer mesh (3201 nodes)
# changes it by 0.001 percent. The tolerance holds this mesh error and the rounding of the published value
# (4 digits), with a margin for a change of mesh or solver version.
# Deflection in z of the middle of the free edge, in mm.
rel_tol = 0.01
abs_tol = 0.0

[tip_deflection_z]
value = -302.4
set = "TIP"
field = "U"
component = 3
op = "value"
