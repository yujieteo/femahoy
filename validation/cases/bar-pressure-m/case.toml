# The case bar-pressure in SI-m: the same part, load and answer, in m, N and Pa (M2b).
# The case declares named regions. fh mesh makes a gmsh physical group for each region, and
# fh model writes each region as a node set and an element-face surface. The load is *DSLOAD.
# Class N: the stress field is uniform, so C3D10 reproduces it to round-off.
schema = 2
id = "bar-pressure-m"
units = "SI-m"
class = "N"
justification = "The pressure on a flat face gives a uniform stress and a linear displacement field, which C3D10 represents exactly. No mesh error exists, so Richardson does not apply. The tolerance covers round-off in a sparse solve only. Each reference is far from zero, so the absolute tolerance is 0."
derivation = "../bar-pressure/derivation.md"
element_types = ["C3D10"]
# bar.inp is the output of: fh mesh bar.step --case . --size 0.008 -o bar.msh && fh model bar.msh --case . -o bar.inp
mesh = ["bar.inp"]
rel_tol = 1e-6
abs_tol = 0.0

[model]
step = "LOAD"

[model.material]
name = "STEEL"
youngs_modulus = 2.1e11
poissons_ratio = 0.3

# Named regions: the faces of the part on a coordinate plane. Units are m.
[[model.region]]
name = "SUPPORT"
axis = "x"
at = 0.0

[[model.region]]
name = "SYM_Y"
axis = "y"
at = 0.0

[[model.region]]
name = "SYM_Z"
axis = "z"
at = 0.0

[[model.region]]
name = "LOAD"
axis = "x"
at = 0.1

[[model.boundary]]
set = "SUPPORT"
first_dof = 1

[[model.boundary]]
set = "SYM_Y"
first_dof = 2

[[model.boundary]]
set = "SYM_Z"
first_dof = 3

# A negative pressure pulls the face: 1e8 Pa of tension.
[[model.dsload]]
surface = "LOAD"
pressure = -1.0e8

# Stress 1e8 Pa. Reaction 1e8 Pa * 2e-4 m2 = 20000 N. Tip 1e8 / 2.1e11 * 0.1 m.
[ref]
s_xx = 1.0e8
rf_x = -20000.0
u_x_tip = 4.761904761904762e-5

[quantity.s_xx]
set = "ALL"
field = "S"
component = 11
step = "LOAD"
op = "mean"

[quantity.rf_x]
set = "SUPPORT"
field = "RF"
component = 1
step = "LOAD"
op = "sum"

[quantity.u_x_tip]
set = "LOAD"
field = "U"
component = 1
step = "LOAD"
op = "mean"
