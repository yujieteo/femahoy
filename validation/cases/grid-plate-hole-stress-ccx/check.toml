# The steel plate with a hole and the copper pad of grid-plate-hole-ccx, heated by 100 C, against
# CalculiX 2.23 with C3D10 elements on a gmsh mesh of the same problem (ccx/, H = 1 mm: 424,717
# nodes). See derivation.md.
# Tolerance budget, from 3 meshes of each solver: the error of the grid solver at max_cell 4 mm
# is at most 0.5 % (pad_corner.uz), and the error of the CalculiX reference is at most 0.4 %
# (pad_corner.uz). Their sum is 0.9 %. The tolerance is 1 %.
rel_tol = 0.01
abs_tol = 0.0

