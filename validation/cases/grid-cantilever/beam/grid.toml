# A steel beam 100 x 10 x 10 mm, clamped at x = 0, with a shear force of 100 N on its free end.
# The reference is the Timoshenko beam theory. See ../derivation.md.
units = "SI-mm"

[grid]
max_cell = 2.5

[material.steel]
youngs_modulus = 210e3
poisson_ratio = 0.3

[part.beam]
material = "steel"
x = [0.0, 100.0]
y = [0.0, 10.0]
z = [0.0, 10.0]

[face.root]
side = "x-"

[face.tip]
side = "x+"

[[load]]
ux = 0.0
uy = 0.0
uz = 0.0
face = "root"

[[load]]
traction = [0.0, 0.0, -1.0]
face = "tip"

[step]
type = "static"

[probe.tip]
point = [100.0, 5.0, 5.0]

[probe.middle_top]
point = [51.25, 5.0, 10.0]

[probe.middle_bottom]
point = [51.25, 5.0, 0.0]
