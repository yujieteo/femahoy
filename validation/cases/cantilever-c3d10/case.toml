# Cantilever, tip load in z, 8 elements along x. Each source hex gives 24 quadratic tets with
# shared face and edge nodes. The 1 N load stays on the 4 original tip nodes.
schema = 3
id = "cantilever-c3d10"
units = "SI-mm"
justification = "Reference is Timoshenko beam theory. Beam theory ignores the 3D stress state at the clamp, so the reference has a stated error of 2 percent. This is an accepted engineering estimate. On mesh-8.inp, fh-solve-ccx gives a value 1.4 percent below the reference (derivation.md). The 2 percent tolerance holds this mesh error."
derivation = "derivation.md"
mesh = "mesh-8.inp"
rel_tol = 0.02
abs_tol = 0.0

# Tip deflection in z (mean of the tip nodes), in mm.
[ref]
tip_deflection_z = -0.01919619048

[quantity.tip_deflection_z]
set = "tip"
field = "U"
component = 3
step = "tip-load"
op = "mean"
