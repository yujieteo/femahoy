# The 1 N load stays on the 4 original tip nodes.
# Each source hex gives 24 quadratic tets with shared face and edge nodes.
# Cantilever, tip load in z. Class L: 4 meshes, 4, 8, 16 and 32 elements along x.
schema = 2
id = "cantilever-c3d10"
units = "SI-mm"
class = "L"
justification = "Reference is Timoshenko beam theory. The geometry and 1 N total load match the original cantilever. Richardson over the 3 finest meshes gives the discretisation error. The original 2 percent reference error covers the 3D effects that beam theory ignores. It is an accepted engineering estimate. The original order band of 1.0 to 3.0 includes the observed order of 1.96."
derivation = "derivation.md"
element_types = ["C3D10"]
mesh = ["mesh-4.inp", "mesh-8.inp", "mesh-16.inp", "mesh-32.inp"]
ratio = 2
reference_error = 0.02
order_min = 1.0
order_max = 3.0

# Tip deflection in z (mean of the 4 tip nodes), in mm.
[ref]
tip_deflection_z = -0.01919619048

[quantity.tip_deflection_z]
set = "tip"
field = "U"
component = 3
step = "tip-load"
op = "mean"
