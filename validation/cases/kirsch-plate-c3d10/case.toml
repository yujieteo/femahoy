# Quarter plate with a hole under uniaxial tension, plane strain. Class L: 3 meshes.
# Cells over 90 degrees x cells in radius: 4x4, 8x8 and 16x16. Each cell gives 24 tets.
# The hole edge cells have 90 degrees / 16 = 5.6 degrees of arc on the finest mesh (0.98 mm).
# The finest mesh has 6144 tets. A finer mesh made the debug tests take over 10 minutes.
schema = 2
id = "kirsch-plate-c3d10"
units = "SI-mm"
class = "L"
justification = "Reference is the Kirsch closed form for a hole in an infinite plate. The plate is finite (half-width 20 hole radii), so the reference has a stated error of 1 percent: the finite-width gain of the hole-edge stress is about 0.3 percent at this width. Richardson over the 3 finest meshes gives the discretisation error. The solver reports one stress for each element, so the value sits at the element centroid, not on the edge. This offset shrinks with the mesh size, with order near 1. The order band 0.5 to 2.5 includes it."
derivation = "derivation.md"
element_types = ["C3D10"]
mesh = ["mesh-4x4.inp", "mesh-8x8.inp", "mesh-16x16.inp"]
ratio = 2
reference_error = 0.01
order_min = 0.5
order_max = 2.5

# Stress in MPa. Far-field tension is 100 MPa along x.
# edge90: S11 on the hole edge at theta = 90 degrees is 3 x 100 MPa.
# edge0: S22 on the hole edge at theta = 0 is -100 MPa.
[ref]
sigma_edge90 = 300.0
sigma_edge0 = -100.0

[quantity.sigma_edge90]
set = "edge90"
field = "S"
component = 11
step = "tension"
op = "max"

[quantity.sigma_edge0]
set = "edge0"
field = "S"
component = 22
step = "tension"
op = "min"
