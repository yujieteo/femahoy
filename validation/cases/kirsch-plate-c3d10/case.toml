# Quarter plate with a hole under uniaxial tension, plane strain, 16 x 16 cells.
# Cells over 90 degrees x cells in radius. Each cell gives 24 tets, so the mesh has 6144 tets.
# The hole edge cells have 90 degrees / 16 = 5.6 degrees of arc (0.98 mm).
schema = 3
id = "kirsch-plate-c3d10"
units = "SI-mm"
justification = "Reference is the Kirsch closed form for a hole in an infinite plate. The plate is finite (half-width 20 hole radii), so the reference has a stated error of 1 percent. The solver reports one stress for each element, so the value sits at the element centroid, not on the edge. On mesh-16x16.inp, this offset makes fh-solve-ccx give values 6 and 13 percent below the references (derivation.md). The 15 percent tolerance holds this offset and the reference error."
derivation = "derivation.md"
mesh = "mesh-16x16.inp"
rel_tol = 0.15
abs_tol = 0.0

# Stress in MPa. Far-field tension is 100 MPa along x.
# edge90: S11 on the hole edge at theta = 90 degrees is 3 x 100 MPa.
# edge0: S22 on the hole edge at theta = 0 is -100 MPa.
[ref]
sigma_edge90 = 300.0
sigma_edge0 = -100.0

[quantity.sigma_edge90]
set = "edge90"
field = "S"
component = 11
step = "tension"
op = "max"

[quantity.sigma_edge0]
set = "edge0"
field = "S"
component = 22
step = "tension"
op = "min"
