# The steel plate on its edge from the chat, with the 20 mm mesh of the chat, through CalculiX.
schema = 3
id = "plate-on-edge"
units = "SI-mm"
justification = "The reference is the converged value of a separate graded hex model in CalculiX (derivation.md). The 20 mm tetrahedral mesh is 3.8 percent from it. The 5 percent tolerance holds this mesh error and the 0.2 percent error of the reference."
derivation = "derivation.md"
mesh = "part.inp"
# A 16 GB laptop solved this mesh in 12 s with 2.9 GiB. The limits stop a run that is 10 times slower or 2 times larger.
time_limit_s = 120.0
memory_limit_mib = 6144.0
rel_tol = 0.05
abs_tol = 0.0

[model]
step = "LOAD"

[model.material]
name = "STEEL"
youngs_modulus = 210000.0
poissons_ratio = 0.3

# Fixed ends.
[[model.region]]
name = "END_L"
axis = "x"
at = -1878.0

[[model.region]]
name = "END_R"
axis = "x"
at = 1878.0

# Pins: 20 mm pads on the bottom edge.
[[model.region]]
name = "PIN_L"
box = [-1311.0, -501.0, -2.0, -1289.0, -499.0, 2.0]

[[model.region]]
name = "PIN_R"
box = [1289.0, -501.0, -2.0, 1311.0, -499.0, 2.0]

# Load pads on the top edge: 2 x 50 mm at each load point.
[[model.region]]
name = "UP_1500"
box = [-1551.0, 499.0, -2.0, -1449.0, 501.0, 2.0]

[[model.region]]
name = "UP_1200"
box = [-1251.0, 499.0, -2.0, -1149.0, 501.0, 2.0]

[[model.region]]
name = "DN_1200_L"
box = [1149.0, 499.0, -2.0, 1201.0, 501.0, 2.0]

[[model.region]]
name = "DN_1200_R"
box = [1199.0, 499.0, -2.0, 1251.0, 501.0, 2.0]

[[model.region]]
name = "DN_1500_L"
box = [1449.0, 499.0, -2.0, 1501.0, 501.0, 2.0]

[[model.region]]
name = "DN_1500_R"
box = [1499.0, 499.0, -2.0, 1551.0, 501.0, 2.0]

[[model.boundary]]
set = "END_L"
first_dof = 1
last_dof = 3

[[model.boundary]]
set = "END_R"
first_dof = 1
last_dof = 3

[[model.boundary]]
set = "PIN_L"
first_dof = 2
last_dof = 3

[[model.boundary]]
set = "PIN_R"
first_dof = 2
last_dof = 3

# Positive pressure pushes into the body (-y on the top edge).
# Upward 2700 N on 100 x 2.4 mm: -11.25 MPa.
[[model.dsload]]
surface = "UP_1500"
pressure = -11.25

[[model.dsload]]
surface = "UP_1200"
pressure = -11.25

# Downward 2700 N and +800000 Nmm about z: -17350 N on the left half, +14650 N on the right half (50 x 2.4 mm each).
[[model.dsload]]
surface = "DN_1200_L"
pressure = 144.583333

[[model.dsload]]
surface = "DN_1200_R"
pressure = -122.083333

[[model.dsload]]
surface = "DN_1500_L"
pressure = 144.583333

[[model.dsload]]
surface = "DN_1500_R"
pressure = -122.083333

# The converged values of the graded hex model (derivation.md). + is up.
[ref]
pin_r_ry = 2279.2
pin_l_ry = -1274.6

[quantity.pin_r_ry]
set = "PIN_R"
field = "RF"
component = 2
step = "LOAD"
op = "sum"

[quantity.pin_l_ry]
set = "PIN_L"
field = "RF"
component = 2
step = "LOAD"
op = "sum"
