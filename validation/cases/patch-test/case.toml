# Patch test. Class N: the field is linear, so the exact result has no discretisation error.
schema = 2
id = "patch-test"
units = "SI-mm"
class = "N"
justification = "The imposed displacement field is linear, so C3D8 must reproduce it and its uniform stress to round-off. No mesh error exists, so Richardson does not apply. The tolerance covers round-off in a sparse solve only."
derivation = "derivation.md"
element_types = ["C3D8"]
mesh = ["../../../fixtures/inp/patch-test.inp"]
rel_tol = 1e-8
abs_tol = 1e-12

# Displacement of interior node 9 at (0.25, 0.25, 0.25) in mm, and stress in every element in MPa.
[ref]
u9_x = 0.000325
u9_y = 0.000225
u9_z = 0.000175
s_xx = 327.6
s_yy = 243.6
s_zz = 226.8
s_xy = 42.0
s_yz = 16.8
s_zx = 25.2

# Node 9 is the interior node. Set N9 is not in patch-test.inp yet (see SCHEMA.md).

[quantity.u9_x]
set = "N9"
field = "U"
component = 1
step = "LOAD"
op = "value"

[quantity.u9_y]
set = "N9"
field = "U"
component = 2
step = "LOAD"
op = "value"

[quantity.u9_z]
set = "N9"
field = "U"
component = 3
step = "LOAD"
op = "value"

[quantity.s_xx]
set = "ALL"
field = "S"
component = 11
step = "LOAD"
op = "mean"

[quantity.s_yy]
set = "ALL"
field = "S"
component = 22
