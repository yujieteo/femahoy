# Lame thick cylinder, quarter model, plane strain, 8 x 4 cells. Each source hex gives 24
# quadratic tets with shared face and edge nodes. Inner tet faces get *DLOAD pressure 100 MPa,
# with straight chord geometry.
schema = 3
id = "lame-cylinder-c3d10"
units = "SI-mm"
justification = "Reference is the closed-form Lame solution, which has no stated error. On mesh-8x4.inp, fh-solve-ccx gives values 0.7 and 0.5 percent below the references (derivation.md). This mesh error includes the chord approximation of the arc. The 1 percent tolerance holds it."
derivation = "derivation.md"
mesh = "mesh-8x4.inp"
rel_tol = 0.01
abs_tol = 0.0

# Radial displacement at the inner radius r = 100 mm and at the outer radius r = 200 mm, in mm.
# U1 on the theta = 0 plane is the radial displacement.
[ref]
ur_inner = 0.09079365079
ur_outer = 0.05777777778

[quantity.ur_inner]
set = "inner0"
field = "U"
component = 1
step = "pressure"
op = "mean"

[quantity.ur_outer]
set = "outer0"
field = "U"
component = 1
step = "pressure"
op = "mean"
