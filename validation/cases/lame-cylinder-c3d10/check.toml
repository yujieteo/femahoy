# The reference is the closed-form Lame solution (derivation.md). On this mesh, ccx gives values
# 0.7 and 0.5 percent below it. This mesh error includes the chord approximation of the arc.
# Radial displacement at the inner radius r = 100 mm and at the outer radius r = 200 mm, in mm.
rel_tol = 0.01
abs_tol = 0.0

[ur_inner]
