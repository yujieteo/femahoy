# Bimetal strip with a uniform temperature change. Class N: the curvature far from the free end has a closed form.
schema = 2
id = "bimetal-strip"
units = "SI-mm"
class = "N"
justification = "Both materials have nu = 0, so the curvature far from the free end is exactly the Timoshenko (1925) value. C3D8I on a regular mesh gives pure bending exactly. Thus the tolerance covers only the 6 significant digits of the ccx .frd file."
derivation = "derivation.md"
element_types = ["C3D8I"]
# fh-solve has no thermal strain. CalculiX solves this case.
solver = "fh-solve-ccx"
# strip.inp is the output of: python3 scripts/gen-bimetal-strip.py
mesh = ["strip.inp"]
rel_tol = 1e-5
abs_tol = 0.0

# Node P20 at (20, 0, 0) mm. u3 = -kappa x^2 / 2 and u1 = eps0 x, with kappa = 7/9125 1/mm and eps0 = 659/730000.
[ref]
u3_p20 = -0.15342465753424658
u1_p20 = 0.018054794520547944

[quantity.u3_p20]
set = "P20"
field = "U"
component = 3
step = "HEAT"
op = "value"

[quantity.u1_p20]
set = "P20"
field = "U"
component = 1
step = "HEAT"
op = "value"
