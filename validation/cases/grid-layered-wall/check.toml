# A wall of 3 layers with a convection on each side (derivation.md). The temperature is linear in
# each layer, and the hex8 cells hold a linear field exactly. Thus the discretization error is 0,
# and the max_cell 0.05 and 0.025 grids give the same values to 1e-12 C. The tolerance is the
# precision of the direct solve, with a factor of 1e5 of margin.
rel_tol = 0.0
abs_tol = 1e-6

