# A steel bar of round section with an end shear force, against the beam theory
# (derivation.md).
# Tolerance budget for tip.uz: the 3D clamp makes the bar 0.60 % stiffer than the Timoshenko beam
# (the extrapolation of 3 meshes), and the discretization error at max_cell 5 mm is 0.34 %. Their
# sum is 0.94 %. The bending stress at the middle is the Saint-Venant stress, and its
# discretization error at max_cell 5 mm is at most 0.42 % (middle_bottom). The tolerance 1.5 %
# holds both.
rel_tol = 0.015
abs_tol = 0.0

[tip_uz]
value = -0.2557734
case = "bar"
file = "probes.txt"
column = "tip.uz"

[top_sxx]
value = 40.06431
case = "bar"
file = "probes.txt"
column = "middle_top.sxx"

[bottom_sxx]
value = -40.06431
case = "bar"
file = "probes.txt"
column = "middle_bottom.sxx"
