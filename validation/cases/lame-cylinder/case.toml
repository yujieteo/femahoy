# Lame thick cylinder, quarter model, plane strain. Class L: 3 meshes, 4x2, 8x4 and 16x8 elements.
id = "lame-cylinder"
class = "L"
justification = "Reference is the closed-form Lame solution. Richardson over 3 meshes gives the discretisation error. The chord approximation of the arc is part of that error. The closed form has no stated error, so reference_error is 0. The captain accepted it."
derivation = "derivation.md"
mesh = ["mesh-4x2.inp", "mesh-8x4.inp", "mesh-16x8.inp"]
ratio = 2
reference_error = 0

# Radial displacement at the inner radius r = 100 mm and at the outer radius r = 200 mm, in mm.
[ref]
ur_inner = 0.09079365079
ur_outer = 0.05777777778
