# Lame thick cylinder, quarter model, plane strain. Class L: 4 meshes, 4x2, 8x4, 16x8 and 32x16 elements.
schema = 2
id = "lame-cylinder"
class = "L"
justification = "Reference is the closed-form Lame solution. Richardson over the 3 finest of 4 meshes gives the discretisation error. The chord approximation of the arc is part of that error. The closed form has no stated error, so reference_error is 0. The captain accepted it. The order band 1.5 to 2.5 holds the expected order of 2 for trilinear elements (the solver values give 1.97). A lower order widens the Richardson estimate, so it fails."
derivation = "derivation.md"
element_types = ["C3D8"]
mesh = ["mesh-4x2.inp", "mesh-8x4.inp", "mesh-16x8.inp", "mesh-32x16.inp"]
ratio = 2
reference_error = 0
order_min = 1.5
order_max = 2.5

# Radial displacement at the inner radius r = 100 mm and at the outer radius r = 200 mm, in mm.
# U1 on the theta = 0 plane is the radial displacement.
[ref]
ur_inner = 0.09079365079
ur_outer = 0.05777777778

[quantity.ur_inner]
set = "inner0"
field = "U"
component = 1
step = "pressure"
op = "mean"

[quantity.ur_outer]
set = "outer0"
field = "U"
component = 1
step = "pressure"
op = "mean"
