# A stripline (strip width 1 mm in the middle between 2 ground planes 2 mm apart, relative
# permittivity 2.2) against the exact zero-thickness answer of Cohn (derivation.md). Tolerance
# budget: the error of Z0, C and L is 6.4e-4 of the value. Of this, 4.6e-4 comes from the
# thickness of the strip (0.2 um, 1e-4 of the spacing: a strip 10 times thinner moves Z0 by
# 4.2e-4), and 2e-4 from the mesh (max_growth 1.1 against 1.05 moves Z0 by 3.9e-4, and the change
# falls by about 2 for each halving). The magnetic walls 10 spacings from the strip add less than
# 1e-12. The effective permittivity is exact in a single dielectric. The tolerance 1e-3 holds the
# sum, 6.6e-4, with a margin of a factor of 1.5.
rel_tol = 1e-3
abs_tol = 0.0

