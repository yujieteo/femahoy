# A copper bar 10 mm long with a section of 1 x 2 mm, 1 V across its ends (../derivation.md).
units = "SI-mm"

[grid]
max_cell = 0.5
max_growth = 1.3

[material.copper]
electric_conductivity = 5.8e7

[part.bar]
material = "copper"
x = [0.0, 10.0]
y = [0.0, 1.0]
z = [0.0, 2.0]

[face.left]
side = "x-"

[face.right]
side = "x+"

[[load]]
voltage = 1.0
face = "left"

[[load]]
voltage = 0.0
face = "right"

[step]
type = "conduction"
