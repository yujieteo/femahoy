# Manufactured solution on the unit cube, C3D10. Class R: 3 meshes of a jittered lattice.
schema = 2
id = "mms-c3d10"
units = "SI-m"
class = "R"
justification = "The exact field solves the elasticity equations with no body force, for any E and nu, so the only error is the discretisation error. A quadratic element has the L2 rate 3 for displacement (3 is the asymptotic value). The rate is the least squares slope over all 3 meshes, and the coarse meshes are not yet asymptotic. The solver gives 2.62, and the band 2.2 to 3.0 excludes the rate of an element that lost one order. The meshes are distorted, so a narrower band fails on correct code."
derivation = "derivation.md"
element_types = ["C3D10"]
mesh = ["mesh-1.inp", "mesh-2.inp", "mesh-4.inp"]
mesh_size = [1.0, 0.5, 0.25]
boundary_set = "BOUNDARY"
rate = 2.6
band = 0.4

# The exact displacement u = grad(phi), with phi = sin(a x) sin(a y) sinh(sqrt(2) a z) and a = 1.5.
[exact]
u1 = "1.5 * cos(1.5 * x) * sin(1.5 * y) * sinh(1.5 * sqrt(2) * z)"
u2 = "1.5 * sin(1.5 * x) * cos(1.5 * y) * sinh(1.5 * sqrt(2) * z)"
u3 = "1.5 * sqrt(2) * sin(1.5 * x) * sin(1.5 * y) * cosh(1.5 * sqrt(2) * z)"
