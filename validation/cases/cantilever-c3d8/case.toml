# C3D8 cantilever, tip load in z. Class L: 8, 16, 32 and 64 elements along x.
schema = 2
id = "cantilever-c3d8"
units = "SI-mm"
class = "L"
justification = "Reference and tolerances match the original cantilever. Each mesh has 4 elements through y and z. Axial refinement uses 8, 16, 32 and 64 elements. Richardson estimates the axial error only. The observed order is 1.78, inside the original band of 1.0 to 3.0. The extrapolated deflection differs from beam theory by 1.43 percent, inside its stated 2 percent reference error. This case does not establish convergence under section refinement."
derivation = "derivation.md"
element_types = ["C3D8"]
mesh = ["mesh-8.inp", "mesh-16.inp", "mesh-32.inp", "mesh-64.inp"]
ratio = 2
reference_error = 0.02
order_min = 1.0
order_max = 3.0

# Tip deflection in z (mean of the 4 tip nodes), in mm.
[ref]
tip_deflection_z = -0.01919619048

[quantity.tip_deflection_z]
set = "tip"
field = "U"
component = 3
step = "tip-load"
op = "mean"
