# The unit cell of an aluminium-polymer laminate against the exact layer theory (derivation.md).
# Tolerance budget: in each layer the exact fluctuation of each load case is linear in z, and
# the cells hold a linear field exactly. Thus the discretization error is 0, and max_cell 0.25
# and 0.125 give the same values to 1e-10. The tolerance is the precision of the direct solve
# and of the 10 digits of the table, with a factor of 1e4 of margin.
rel_tol = 1e-6
abs_tol = 0.0

