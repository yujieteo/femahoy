# Cantilever, tip load in z. Class L: 4 meshes, 4, 8, 16 and 32 elements along x.
schema = 2
id = "cantilever"
class = "L"
justification = "Reference is Timoshenko beam theory. Richardson over the 3 finest of 4 meshes gives the discretisation error. The reference error of 2 percent covers the 3D clamp effect, which beam theory ignores. The captain accepted it."
derivation = "derivation.md"
mesh = ["../../../fixtures/inp/cantilever.inp", "mesh-8.inp", "mesh-16.inp", "mesh-32.inp"]
ratio = 2
reference_error = 0.02

# Tip deflection in z (mean of the 4 tip nodes), in mm.
[ref]
tip_deflection_z = -0.01919619048

[extract.tip_deflection_z]
field = "U3"
set = "tip"
reduction = "mean"
