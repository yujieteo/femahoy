# The pressure on a flat face gives a uniform stress and a linear displacement field, which C3D10
# represents exactly. The tolerance covers round-off in a sparse solve only.
# Stress 100 MPa. Reaction 100 MPa * 200 mm2 = 20000 N. Tip 100 / 210000 * 100 mm.
rel_tol = 1e-6
abs_tol = 0.0

[s_xx]
value = 100.0
set = "ALL"
field = "S"
component = 11
op = "mean"

[rf_x]
value = -20000.0
set = "SUPPORT"
field = "RF"
component = 1
op = "sum"

[u_x_tip]
value = 0.047619047619047616
set = "LOAD"
field = "U"
component = 1
op = "mean"
