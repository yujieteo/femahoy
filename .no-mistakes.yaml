# The no-mistakes test step runs this command. FH_REQUIRE_CCX=1 makes a missing ccx fail a test.
# Without it, a test that solves skips and passes. The OpenFOAM path does not exist, so the
# validation suite skips here. Only the Test step of .github/workflows/ci.yml runs it.
commands:
  test: FH_REQUIRE_CCX=1 FH_OPENFOAM=/nonexistent/openfoam cargo test --workspace
