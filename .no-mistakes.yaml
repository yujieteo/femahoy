# The no-mistakes test step runs this command. It matches the Test step of .github/workflows/ci.yml.
# FH_REQUIRE_CCX=1 and FH_REQUIRE_OPENFOAM=1 make a missing ccx or openfoam fail a test. Without
# them, a test that solves skips and passes.
commands:
  test: FH_REQUIRE_CCX=1 FH_REQUIRE_OPENFOAM=1 cargo test --workspace
